<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <title>Box Out For Hunger</title>
  <style>
    :root{color-scheme:dark;--black:#11110f;--white:#f5f2eb;--orange:#ff6b35;--line:#373632;font-family:Arial,Helvetica,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white)}a{color:inherit;text-decoration:none}
    .toolbar{height:78px;padding:0 clamp(18px,5vw,72px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--black)}
    .brand{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:800;letter-spacing:.04em;line-height:1.05}.brand-mark{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:var(--black);font-size:19px}.brand-name small{display:block;margin-top:4px;color:#aaa79f;font-size:8px;letter-spacing:.18em}
    .nav{display:flex;align-items:center;gap:clamp(16px,2.6vw,38px)}.nav a{font-size:12px;font-weight:600;color:#d5d2ca;transition:color .2s}.nav a:hover,.nav a:focus-visible{color:var(--orange)}
    .donate{padding:13px 17px;background:var(--orange);color:var(--black)!important;font-weight:800!important}.menu-toggle{display:none;width:42px;height:42px;padding:0;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;color:var(--white);cursor:pointer}.menu-toggle svg{width:21px;height:21px}
    @media(max-width:680px){.toolbar{height:68px;padding-inline:18px}.menu-toggle{display:flex}.nav{display:none;position:absolute;z-index:5;top:68px;left:0;right:0;padding:8px 18px 18px;background:var(--black);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:0}.nav.open{display:flex}.nav a{padding:15px 3px;border-bottom:1px solid var(--line);font-size:14px}.nav .donate{margin-top:12px;padding:14px;text-align:center;border:0}}
  </style>
</head>
<body>
  <header class="toolbar">
    <a class="brand" href="#home" aria-label="Box Out For Hunger home"><span class="brand-mark">B</span><span class="brand-name">BOX OUT FOR HUNGER<small>COMMUNITY • CARE • ACTION</small></span></a>
    <nav class="nav" id="site-nav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a class="donate" href="#donate">Donate</a>
      <a href="#announcements">Announcements</a>
      <a href="#news">News</a>
      <a href="#team">Meet the Team</a>
    </nav>
    <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-nav">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
  </header>
  <script>
    const menuButton = document.querySelector('.menu-toggle');
    const siteNav = document.querySelector('#site-nav');
    menuButton.addEventListener('click', () => {
      const open = menuButton.getAttribute('aria-expanded') !== 'true';
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
      siteNav.classList.toggle('open', open);
    });
    siteNav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
      siteNav.classList.remove('open');
      menuButton.setAttribute('aria-expanded', 'false');
      menuButton.setAttribute('aria-label', 'Open navigation menu');
    }));
  </script>
</body>
</html>
